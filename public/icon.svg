<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#gold)" stroke-width="14" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="8 8" />
  
  <!-- Crossed Paletas -->
  <g transform="translate(256,256)">
    <!-- Paleta 1 -->
    <g transform="rotate(-35)">
      <rect x="-14" y="20" width="28" height="150" rx="8" fill="#d97706" stroke="#92400e" stroke-width="4" />
      <ellipse cx="0" cy="-60" rx="64" ry="105" fill="#f59e0b" stroke="#78350f" stroke-width="6" />
      <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#78350f" stroke-width="4" opacity="0.4" />
    </g>
    <!-- Paleta 2 -->
    <g transform="rotate(35)">
      <rect x="-14" y="20" width="28" height="150" rx="8" fill="#b45309" stroke="#78350f" stroke-width="4" />
      <ellipse cx="0" cy="-60" rx="64" ry="105" fill="#d97706" stroke="#78350f" stroke-width="6" />
      <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#78350f" stroke-width="4" opacity="0.4" />
    </g>
    <!-- Black Pelota Ball -->
    <circle cx="0" cy="-10" r="30" fill="#0f172a" stroke="#fbbf24" stroke-width="5" />
    <circle cx="-8" cy="-18" r="8" fill="#475569" opacity="0.6" />
  </g>
</svg>
